name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.24.x'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  ACTIONLINT_VERSION: 'v1.7.7'

jobs:
  go-and-products:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download modules
        env:
          GOWORK: 'off'
        run: go mod download
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build peer commands
        env:
          GOWORK: 'off'
        run: go build ./cmd/...
      - name: Test product fixtures
        env:
          GOWORK: 'off'
        run: go test ./...
      - name: Race test product fixtures
        env:
          GOWORK: 'off'
        run: go test -race ./...
      - name: Vet
        env:
          GOWORK: 'off'
        run: go vet ./...
      - name: Lint
        env:
          GOWORK: 'off'
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint run ./...
      - name: Pi-family native bridges
        run: node --test wrappers/pifamily/extension/bridge.test.mjs wrappers/pi/native.test.mjs wrappers/pi/extension.test.mjs wrappers/omp/extension.test.mjs
      - name: Pi and OMP archives
        run: |
          for product in pi omp; do
            ./scripts/package-product "$product" "${RUNNER_TEMP}/$product archive"
          done

  workflow-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - run: actionlint
